name: CI

on:
  push:
    branches:
      - main
      - preview
  pull_request:
    branches:
      - main
      - preview
  workflow_dispatch:

jobs:
  Check-Links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test link checker
        run: python -m unittest discover -s tests
      - name: Check newly introduced external links
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_REF" || "$BASE_REF" =~ ^0+$ ]]; then
            BASE_REF=HEAD^
          fi
          python check_links.py --base-ref "$BASE_REF"

  Build-Main:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: Check-Links
    uses: dynamsoft-docs/Docs-Template-Repo/.github/workflows/called-workflow-build-sync-production.yml@main
    with:
      doc-repo: faq
      doc-url: faq
    secrets: inherit

  Build-Preview:
    if: ${{ github.ref == 'refs/heads/preview' }}
    needs: Check-Links
    uses: dynamsoft-docs/Docs-Template-Repo/.github/workflows/called-workflow-build-sync-testing.yml@preview
    with:
      doc-repo: faq
      doc-url: faq
    secrets: inherit
